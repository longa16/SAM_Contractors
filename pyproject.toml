[project]
name = "sam-contract"
version = "0.1.0"
description = "GovContractAI — accompagnement des entreprises sur les marchés publics américains"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.10,<4",
    "fastapi>=0.142.2",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.0.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0,<3",
    "tenacity>=9.2.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
    "types-requests>=2.33.0.20261006",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live' --cov=app/sam --cov=app/services --cov-report=term-missing --cov-fail-under=85"
markers = ["live: requires real external credentials and is excluded by default"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["app/db/migrations"]
